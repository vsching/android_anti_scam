<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Anot? — Page Not Found</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --indigo: #4F46E5;
  --indigo-light: #EEF2FF;
  --text: #1E293B;
  --text-secondary: #64748B;
  --radius: 16px;
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Quicksand', sans-serif;
  color: var(--text);
  line-height: 1.7;
  background: linear-gradient(160deg, #1E1B4B 0%, #312E81 50%, #3730A3 100%);
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 20px;
}

.container {
  max-width: 480px;
}

.shield-icon {
  width: 88px;
  height: 88px;
  margin: 0 auto 28px;
  background: linear-gradient(135deg, var(--indigo), #6366F1);
  border-radius: 22px 22px 26px 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 6px 24px rgba(79, 70, 229, 0.3);
}

.shield-icon .material-symbols-rounded {
  font-size: 44px;
  color: #fff;
}

h1 {
  font-size: 2.2rem;
  font-weight: 800;
  color: #fff;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.error-code {
  font-size: 1rem;
  font-weight: 700;
  color: #A5B4FC;
  margin-bottom: 16px;
}

p {
  font-size: 1rem;
  color: #C7D2FE;
  font-weight: 500;
  margin-bottom: 32px;
  line-height: 1.7;
}

.home-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 16px 36px;
  background: linear-gradient(135deg, #4F46E5, #7C3AED);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 800;
  font-family: inherit;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4);
}

.home-btn:hover {
  transform: translateY(-3px);
  box-shadow: 0 10px 30px rgba(79, 70, 229, 0.5);
}

.home-btn:active {
  transform: translateY(0);
}

@media (max-width: 480px) {
  h1 { font-size: 1.8rem; }
}
</style>
</head>
<body>

<div class="container">
  <div class="shield-icon">
    <span class="material-symbols-rounded">shield</span>
  </div>
  <h1>Page Not Found</h1>
  <p class="error-code">Error 404</p>
  <p>The page you're looking for doesn't exist or has been moved. Let's get you back to safety.</p>
  <a href="/" class="home-btn">
    <span class="material-symbols-rounded" style="font-size:20px">home</span>
    Go to Homepage
  </a>
</div>

</body>
</html>
