<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Safe Anot? — Spot the Fake Domain Quiz</title>
<meta name="description" content="Can you spot fake scam domains? Take the quiz and test your scam-spotting skills.">
<meta property="og:title" content="Safe Anot? — Can You Spot the Fake?">
<meta property="og:description" content="Test your scam-spotting skills! 5 rounds, 2 domains — pick the real one. Can you get 5/5?">
<meta property="og:image" content="https://safeanot.com/og-challenge.png">
<meta property="og:url" content="https://safeanot.com/challenge">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0" rel="stylesheet">

<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

:root {
  --indigo: #4F46E5;
  --indigo-light: #EEF2FF;
  --teal: #0D9488;
  --red: #DC2626;
  --green: #16A34A;
  --amber: #F59E0B;
  --bg: #FAFAFA;
  --card: #FFFFFF;
  --text: #1E293B;
  --text-secondary: #64748B;
  --radius: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
  --shadow-lg: 0 12px 32px rgba(0,0,0,0.12);
}

html { scroll-behavior: smooth; }

body {
  font-family: 'Quicksand', sans-serif;
  color: var(--text);
  line-height: 1.7;
  background: var(--bg);
  -webkit-font-smoothing: antialiased;
}

.wrap {
  max-width: 680px;
  margin: 0 auto;
  padding: 0 20px;
}

/* === HEADER === */
.site-header {
  background: linear-gradient(160deg, #1E1B4B 0%, #312E81 50%, #3730A3 100%);
  padding: 18px 20px;
}

.site-header .wrap {
  display: flex;
  align-items: center;
  gap: 12px;
}

.nav-back {
  color: #C7D2FE;
  text-decoration: none;
  display: flex;
  align-items: center;
  transition: color 0.2s;
}

.nav-back:hover { color: #fff; }

.nav-logo {
  display: flex;
  align-items: center;
  gap: 10px;
  text-decoration: none;
  color: #fff;
}

.nav-shield {
  width: 36px;
  height: 36px;
  background: linear-gradient(135deg, var(--indigo), #6366F1);
  border-radius: 10px 10px 12px 12px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 2px 8px rgba(79, 70, 229, 0.3);
}

.nav-shield .material-symbols-rounded { font-size: 20px; color: #fff; }

.nav-logo span.logo-text {
  font-size: 1.15rem;
  font-weight: 800;
  color: #fff;
  letter-spacing: -0.3px;
}

/* === QUIZ HERO === */
.quiz-hero {
  background: linear-gradient(160deg, #1E1B4B 0%, #312E81 50%, #3730A3 100%);
  padding: 40px 20px 48px;
  text-align: center;
  color: #F1F5F9;
}

.quiz-hero h1 {
  font-size: 2rem;
  font-weight: 800;
  color: #fff;
  line-height: 1.2;
  margin-bottom: 8px;
  letter-spacing: -0.5px;
}

.quiz-hero p {
  font-size: 0.95rem;
  color: #C7D2FE;
}

/* === QUIZ AREA === */
.quiz-section {
  padding: 32px 0 40px;
}

/* === PROGRESS BAR === */
.progress-bar {
  display: flex;
  gap: 6px;
  margin-bottom: 28px;
}

.progress-dot {
  flex: 1;
  height: 6px;
  border-radius: 3px;
  background: #E5E7EB;
  transition: background 0.3s;
}

.progress-dot.active { background: var(--indigo); }
.progress-dot.correct { background: var(--green); }
.progress-dot.wrong { background: var(--red); }

.round-label {
  text-align: center;
  font-size: 0.85rem;
  color: var(--text-secondary);
  margin-bottom: 6px;
  font-weight: 700;
}

.round-question {
  text-align: center;
  font-size: 1.4rem;
  font-weight: 800;
  margin-bottom: 24px;
  color: var(--text);
}

/* === DOMAIN OPTIONS === */
.domain-options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 24px;
}

.domain-option {
  background: var(--card);
  border: 2px solid #E5E7EB;
  border-radius: var(--radius);
  padding: 22px 24px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 1.05rem;
  font-weight: 700;
  font-family: monospace, 'Quicksand';
  word-break: break-all;
  box-shadow: var(--shadow-sm);
}

.domain-option:hover:not(.disabled) {
  border-color: var(--indigo);
  background: var(--indigo-light);
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
}

.domain-option.selected-correct {
  border-color: var(--green);
  background: #F0FDF4;
  box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.1);
}

.domain-option.selected-wrong {
  border-color: var(--red);
  background: #FEF2F2;
  box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.1);
}

.domain-option.revealed-real {
  border-color: var(--green);
  background: #F0FDF4;
}

.domain-option.revealed-fake {
  border-color: var(--red);
  background: #FEF2F2;
  opacity: 0.6;
}

.domain-option.disabled { cursor: default; }

.domain-label {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 0.75rem;
  font-weight: 800;
  font-family: 'Quicksand', sans-serif;
  margin-top: 10px;
  padding: 4px 14px;
  border-radius: 12px;
}

.domain-label.real { color: var(--green); background: #DCFCE7; }
.domain-label.fake { color: var(--red); background: #FEE2E2; }

/* === EXPLANATION === */
.explanation {
  background: var(--card);
  border: 1px solid #E5E7EB;
  border-radius: var(--radius);
  padding: 20px 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
  animation: fadeIn 0.3s ease-out;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

.explanation h4 {
  font-size: 0.9rem;
  font-weight: 800;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.explanation h4.correct { color: var(--green); }
.explanation h4.wrong { color: var(--red); }

.explanation p {
  font-size: 0.88rem;
  color: var(--text-secondary);
  line-height: 1.7;
  font-weight: 500;
}

/* === NEXT BUTTON === */
.next-btn {
  display: block;
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #4F46E5, #7C3AED);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  font-family: inherit;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
}

.next-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4); }

/* === RESULTS SCREEN === */
.results-screen {
  text-align: center;
  animation: fadeIn 0.5s ease-out;
}

.score-circle {
  width: 140px;
  height: 140px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 24px;
  font-size: 2.8rem;
  font-weight: 800;
}

.score-circle.perfect { background: #DCFCE7; color: var(--green); border: 3px solid var(--green); box-shadow: 0 0 40px rgba(22, 163, 74, 0.15); }
.score-circle.good { background: var(--indigo-light); color: var(--indigo); border: 3px solid var(--indigo); }
.score-circle.ok { background: #FEF3C7; color: var(--amber); border: 3px solid var(--amber); }
.score-circle.bad { background: #FEE2E2; color: var(--red); border: 3px solid var(--red); }

.results-screen h2 {
  font-size: 1.6rem;
  font-weight: 800;
  margin-bottom: 8px;
  color: var(--text);
}

.results-screen .subtitle {
  color: var(--text-secondary);
  font-size: 0.95rem;
  font-weight: 500;
  margin-bottom: 32px;
}

.share-card {
  background: var(--card);
  border: 1px solid #E5E7EB;
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 20px;
  box-shadow: var(--shadow-sm);
}

.share-card p {
  font-size: 1rem;
  font-weight: 700;
  margin-bottom: 16px;
  color: var(--text);
}

.share-btns {
  display: flex;
  gap: 10px;
  justify-content: center;
  flex-wrap: wrap;
}

.share-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 12px 24px;
  border-radius: 14px;
  font-size: 0.88rem;
  font-weight: 700;
  cursor: pointer;
  border: none;
  text-decoration: none;
  transition: all 0.15s ease;
  font-family: inherit;
}

.share-btn:hover { transform: translateY(-2px); }

.share-wa { background: #25D366; color: #fff; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.25); }
.share-wa:hover { box-shadow: 0 6px 20px rgba(37, 211, 102, 0.35); }

.share-copy {
  background: var(--card);
  color: var(--text);
  border: 1px solid #E5E7EB;
  box-shadow: var(--shadow-sm);
}
.share-copy:hover { box-shadow: var(--shadow-md); }

.parent-note {
  background: var(--indigo-light);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 24px;
}

.parent-note p {
  font-size: 0.95rem;
  color: var(--text-secondary);
  line-height: 1.7;
  font-weight: 500;
}

.parent-note strong { color: var(--text); font-weight: 800; }

.dl-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 16px 32px;
  background: linear-gradient(135deg, #4F46E5, #7C3AED);
  color: #fff;
  border: none;
  border-radius: 14px;
  font-size: 1rem;
  font-weight: 800;
  cursor: pointer;
  text-decoration: none;
  font-family: inherit;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
  box-shadow: 0 4px 12px rgba(79, 70, 229, 0.3);
}

.dl-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(79, 70, 229, 0.4); }

.play-again {
  display: inline-block;
  margin-top: 16px;
  color: var(--teal);
  text-decoration: none;
  font-weight: 700;
  font-size: 0.95rem;
}

.play-again:hover { text-decoration: underline; }

/* === FOOTER === */
footer {
  text-align: center;
  padding: 32px 20px;
  font-size: 0.82rem;
  color: var(--text-secondary);
}

footer .heart { color: var(--red); }

footer .footer-links {
  margin-top: 8px;
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}

footer .footer-links a {
  color: var(--text-secondary);
  text-decoration: none;
  font-weight: 600;
}

footer .footer-links a:hover { color: var(--indigo); }

footer .tiktok {
  margin-top: 8px;
  font-weight: 600;
}

/* === RESPONSIVE === */
@media (max-width: 480px) {
  .quiz-hero h1 { font-size: 1.6rem; }
  .round-question { font-size: 1.15rem; }
}
</style>
</head>
<body>

<!-- ====== HEADER ====== -->
<header class="site-header">
  <div class="wrap" style="display:flex;align-items:center;gap:12px;">
    <a href="/" class="nav-back">
      <span class="material-symbols-rounded" style="font-size:22px">arrow_back</span>
    </a>
    <a href="/" class="nav-logo">
      <div class="nav-shield">
        <span class="material-symbols-rounded">shield</span>
      </div>
      <span class="logo-text">Safe Anot?</span>
    </a>
  </div>
</header>

<!-- ====== QUIZ HERO ====== -->
<section class="quiz-hero">
  <div class="wrap">
    <h1>Can you spot the fake?</h1>
    <p>5 rounds. 2 domains. Tap the one you think is REAL.</p>
  </div>
</section>

<!-- ====== QUIZ AREA ====== -->
<section class="quiz-section">
  <div class="wrap">
    <div id="quizArea"></div>
  </div>
</section>

<!-- ====== FOOTER ====== -->
<footer>
  <div class="wrap">
    <p>Made with <span class="heart">❤️</span> in Malaysia to fight scams</p>
    <div class="footer-links">
      <a href="/">Home</a>
      <a href="/check">Check Links</a>
      <a href="#">Privacy</a>
      <a href="#">Terms</a>
    </div>
    <p class="tiktok">@safeanot on TikTok</p>
  </div>
</footer>

<script>
const rounds = [
  {
    real: 'maybank2u.com.my',
    fake: 'maybank2u-verify.com',
    explanation: 'The real Maybank uses maybank2u.com.my — a .com.my domain. The fake adds "-verify" and uses a generic .com domain. Banks never use extra words in their domain.'
  },
  {
    real: 'cimbclicks.com.my',
    fake: 'cimb-secure-login.xyz',
    explanation: 'The real CIMB Clicks is at cimbclicks.com.my. The fake uses a .xyz domain with "secure-login" — a classic phishing tactic to sound trustworthy.'
  },
  {
    real: 'shopee.com.my',
    fake: 'shopee-lucky-draw.top',
    explanation: 'The real Shopee is shopee.com.my. The fake uses a .top domain and adds "lucky-draw" — Shopee never runs promotions from third-party domains.'
  },
  {
    real: 'hasil.gov.my',
    fake: 'lhdn-tax-refund.com',
    explanation: 'LHDN\'s official site is hasil.gov.my — a government .gov.my domain. The fake uses a generic .com with "tax-refund". Government sites always end in .gov.my.'
  },
  {
    real: 'grab.com',
    fake: 'grab-promo-winners.buzz',
    explanation: 'The real Grab is at grab.com. The fake uses a .buzz domain with "promo-winners". Legitimate companies never use exotic TLDs like .buzz for promotions.'
  }
];

let currentRound = 0;
let score = 0;
let answered = false;

function render() {
  if (currentRound >= rounds.length) {
    showResults();
    return;
  }

  const r = rounds[currentRound];
  const showFakeFirst = Math.random() > 0.5;
  const opt1 = showFakeFirst ? r.fake : r.real;
  const opt2 = showFakeFirst ? r.real : r.fake;

  answered = false;

  let progressHTML = '<div class="progress-bar">';
  for (let i = 0; i < rounds.length; i++) {
    let cls = '';
    if (i < currentRound) cls = 'correct';
    else if (i === currentRound) cls = 'active';
    progressHTML += `<div class="progress-dot ${cls}"></div>`;
  }
  progressHTML += '</div>';

  document.getElementById('quizArea').innerHTML = `
    ${progressHTML}
    <div class="round-label">Round ${currentRound + 1} of 5</div>
    <div class="round-question">Which domain is REAL?</div>
    <div class="domain-options">
      <div class="domain-option" id="opt1" onclick="answer('${opt1}', '${r.real}', 'opt1', 'opt2')">${opt1}</div>
      <div class="domain-option" id="opt2" onclick="answer('${opt2}', '${r.real}', 'opt2', 'opt1')">${opt2}</div>
    </div>
    <div id="feedback"></div>
  `;
}

function answer(chosen, real, chosenId, otherId) {
  if (answered) return;
  answered = true;

  const r = rounds[currentRound];
  const isCorrect = chosen === real;
  if (isCorrect) score++;

  const chosenEl = document.getElementById(chosenId);
  const otherEl = document.getElementById(otherId);
  const chosenIsReal = chosen === real;
  const otherIsReal = !chosenIsReal;

  chosenEl.classList.add('disabled', chosenIsReal ? 'selected-correct' : 'selected-wrong');
  otherEl.classList.add('disabled', otherIsReal ? 'revealed-real' : 'revealed-fake');

  function addLabel(el, isReal) {
    const label = document.createElement('div');
    label.className = `domain-label ${isReal ? 'real' : 'fake'}`;
    label.innerHTML = isReal
      ? '<span class="material-symbols-rounded" style="font-size:14px">verified</span> REAL'
      : '<span class="material-symbols-rounded" style="font-size:14px">dangerous</span> FAKE';
    el.appendChild(label);
  }
  addLabel(chosenEl, chosenIsReal);
  addLabel(otherEl, otherIsReal);

  const dots = document.querySelectorAll('.progress-dot');
  dots[currentRound].className = `progress-dot ${isCorrect ? 'correct' : 'wrong'}`;

  document.getElementById('feedback').innerHTML = `
    <div class="explanation">
      <h4 class="${isCorrect ? 'correct' : 'wrong'}">
        <span class="material-symbols-rounded" style="font-size:20px">${isCorrect ? 'check_circle' : 'cancel'}</span>
        ${isCorrect ? 'Correct!' : 'Wrong!'}
      </h4>
      <p>${r.explanation}</p>
    </div>
    <button class="next-btn" onclick="nextRound()">${currentRound < rounds.length - 1 ? 'Next Round' : 'See Results'}</button>
  `;
}

function nextRound() {
  currentRound++;
  render();
}

function showResults() {
  const scoreClass = score === 5 ? 'perfect' : score >= 4 ? 'good' : score >= 3 ? 'ok' : 'bad';
  const emoji = score === 5 ? '🏆' : score >= 4 ? '👏' : score >= 3 ? '🤔' : '😬';
  const message = score === 5
    ? 'Perfect! You can spot scams like a pro.'
    : score >= 4
    ? 'Almost perfect! You have sharp eyes.'
    : score >= 3
    ? 'Not bad, but scammers are getting trickier.'
    : 'Scammers might fool you. Time to learn more!';

  const shareText = `${emoji} I scored ${score}/5 on the Safe Anot? scam quiz! Can you beat me? Try it: ${window.location.href}`;
  const waUrl = `https://wa.me/?text=${encodeURIComponent(shareText)}`;

  document.getElementById('quizArea').innerHTML = `
    <div class="results-screen">
      <div class="score-circle ${scoreClass}">${score}/5</div>
      <h2>You got ${score} out of 5!</h2>
      <p class="subtitle">${message}</p>

      <div class="share-card">
        <p>${emoji} I scored ${score}/5 on Safe Anot? Can you beat me?</p>
        <div class="share-btns">
          <a href="${waUrl}" target="_blank" class="share-btn share-wa">
            <span class="material-symbols-rounded" style="font-size:18px">share</span>
            Share on WhatsApp
          </a>
          <button class="share-btn share-copy" onclick="copyScore()">
            <span class="material-symbols-rounded" style="font-size:18px">content_copy</span>
            Copy
          </button>
        </div>
      </div>

      <div class="parent-note">
        <p><strong>Your parents might not score as well.</strong><br>Download Safe Anot? to protect them from scam links and dangerous apps — before it's too late.</p>
      </div>

      <a href="#" class="dl-btn">
        <span class="material-symbols-rounded" style="font-size:20px">download</span>
        Download Safe Anot? Free
      </a>
      <br>
      <a href="javascript:resetQuiz()" class="play-again">Play Again</a>
    </div>
  `;
}

function copyScore() {
  const text = `I scored ${score}/5 on the Safe Anot? scam quiz! Can you beat me? Try it: ${window.location.href}`;
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.querySelector('.share-copy');
    const orig = btn.innerHTML;
    btn.innerHTML = '<span class="material-symbols-rounded" style="font-size:18px">check</span> Copied!';
    setTimeout(() => { btn.innerHTML = orig; }, 2000);
  });
}

function resetQuiz() {
  currentRound = 0;
  score = 0;
  render();
}

render();
</script>

</body>
</html>
