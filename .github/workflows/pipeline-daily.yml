# CI/CD — daily scam domain pipeline (fetches feeds, builds artifacts, uploads to R2/KV).
name: Daily Pipeline

on:
  schedule:
    - cron: "0 19 * * *"  # 19:00 UTC = 3:00 AM MYT
  workflow_dispatch:       # manual trigger

jobs:
  pipeline:
    name: Seed Database Pipeline
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/pipeline
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/pipeline/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run seed pipeline
        run: python seed_database.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_BUCKET: ${{ secrets.CLOUDFLARE_R2_BUCKET }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}

      - name: Verify artifacts
        run: |
          echo "Pipeline completed successfully"
          echo "Checking for output artifacts..."
          if [ $? -eq 0 ]; then
            echo "Pipeline exit code: 0 (success)"
          else
            echo "Pipeline exit code: $? (failure)"
            exit 1
          fi

      - name: Upload pipeline logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-logs-${{ github.run_id }}
          path: backend/pipeline/*.log
          retention-days: 30
          if-no-files-found: ignore
