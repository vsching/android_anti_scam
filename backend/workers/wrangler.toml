# Safe Anot? API — Cloudflare Worker configuration
name = "safeanot-api"
main = "src/index.ts"
compatibility_date = "2024-03-01"
compatibility_flags = ["nodejs_compat"]

[vars]
ENVIRONMENT = "production"

# KV — allowlist + new domain discoveries only (NOT bulk domain store)
[[kv_namespaces]]
binding = "VERDICTS"
id = "af9c8116ef6d45aca90dbbd4970acf1d"

# R2 — bulk scam database (SQLite, Bloom filter, delta files)
[[r2_buckets]]
binding = "DATA_BUCKET"
bucket_name = "safeanot-data"
preview_bucket_name = "safeanot-data-preview"

# D1 — reports, alerts, guardian pairings, pending discoveries
[[d1_databases]]
binding = "DB"
database_name = "safeanot-db"
database_id = "a05d4663-f225-4ce0-a4fb-bad6fb77a35e"
migrations_dir = "migrations"

# Cron triggers — retention handler runs daily at 3am UTC
[triggers]
crons = ["0 3 * * *"]

# Rate limiting — handled by Cloudflare's built-in infrastructure
# 100 req/min per IP for /api/check
[[unsafe.bindings]]
name = "RATE_LIMITER_CHECK"
type = "ratelimit"
namespace_id = "0"
simple = { limit = 100, period = 60 }

# 10 req/min per IP for /api/report
[[unsafe.bindings]]
name = "RATE_LIMITER_REPORT"
type = "ratelimit"
namespace_id = "1"
simple = { limit = 10, period = 60 }

# Secrets (set via `wrangler secret put`, NOT stored in this file):
# - PIPELINE_SECRET: Authentication key for /api/alerts/notify (pipeline → worker)
# - FIREBASE_SERVICE_ACCOUNT_JSON: Service account JSON for FCM HTTP v1 API
# - FIREBASE_PROJECT_ID: Firebase project ID for FCM URL construction
# - FIREBASE_API_KEY: Firebase API key
