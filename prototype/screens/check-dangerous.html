<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Safe Anot? — Dangerous Result</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Override for standalone dangerous verdict display */
  .verdict-overlay-standalone {
    position: static;
    width: 100%;
    height: 100vh;
    display: flex;
    flex-direction: column;
    opacity: 1;
    pointer-events: auto;
  }
  .verdict-overlay-standalone .verdict-overlay-bg {
    position: fixed;
    inset: 0;
  }
</style>
</head>
<body>

<!-- Toast -->
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<div class="verdict-overlay-standalone">
  <div class="verdict-overlay-bg"></div>
  <div class="verdict-glow red"></div>
  <div class="verdict-content">
    <div class="verdict-shield red">
      <span class="material-symbols-rounded" style="font-variation-settings:'FILL' 1;">gpp_bad</span>
    </div>
    <div class="verdict-label red">DANGEROUS</div>
    <div class="verdict-desc">This domain impersonates Maybank</div>
    <div class="verdict-detail">Real Maybank: <strong>maybank2u.com.my</strong></div>
    <div class="verdict-warning">
      <span class="material-symbols-rounded">warning</span>
      Do NOT enter any passwords
    </div>
  </div>
  <div class="verdict-actions">
    <button class="btn-verdict-primary red" onclick="showToast('Shared to WhatsApp')">
      <span class="material-symbols-rounded">share</span> Share Warning
    </button>
    <button class="btn-verdict-outlined" onclick="showToast('Reported. Thank you!')">
      <span class="material-symbols-rounded">flag</span> Report
    </button>
    <button class="btn-verdict-close" onclick="showToast('Closed')">Close</button>
  </div>
</div>

<script>
function showToast(msg) {
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2200);
}
</script>
</body>
</html>
